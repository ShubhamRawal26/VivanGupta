<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="hero-glow1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow2" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1.5" fill="rgba(250, 204, 21, 0.25)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#030303"/>
  <rect width="100%" height="100%" fill="url(#hero-glow1)"/>
  <rect width="100%" height="100%" fill="url(#hero-glow2)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <path d="M-100 800 C 400 600, 800 1000, 2020 400" fill="none" stroke="url(#line-grad)" stroke-width="1.5" opacity="0.3"/>
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </linearGradient>
  </defs>

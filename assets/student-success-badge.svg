<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11141e"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" rx="20" fill="url(#cardGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="1.5"/>

  <!-- Official Document Header -->
  <rect x="25" y="25" width="450" height="50" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.2)"/>
  <circle cx="50" cy="50" r="14" fill="rgba(16,185,129,0.2)"/>
  <path d="M44 50 L48 54 L57 45" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="75" y="47" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">Official Seat Allotment Confirmation</text>
  <text x="75" y="63" fill="#9ca3af" font-family="Inter, sans-serif" font-size="10">JoSAA / CSAB Special Round Verification &#8226; 100% Authentic</text>

  <!-- Student Verified Info Card -->
  <g transform="translate(25, 95)">
    <rect width="450" height="190" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
    
    <text x="20" y="32" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" font-weight="700">ALLOTTED INSTITUTE</text>
    <text x="20" y="55" fill="#ffffff" font-family="Inter, sans-serif" font-size="17" font-weight="800">NIT Surathkal (Karnataka)</text>
    
    <text x="20" y="90" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11" font-weight="700">ACADEMIC PROGRAM</text>
    <text x="20" y="112" fill="#fbbf24" font-family="Inter, sans-serif" font-size="15" font-weight="700">Electronics &amp; Communication (B.Tech 4Y)</text>

    <line x1="20" y1="130" x2="430" y2="130" stroke="rgba(255,255,255,0.06)"/>

    <text x="20" y="155" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11">Allocated Category: <tspan fill="#ffffff" font-weight="700">OBC-NCL (Home State)</tspan></text>
    <text x="20" y="175" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11">Round Upgraded: <tspan fill="#10b981" font-weight="700">Special Round 1 (+14,200 Rank)</tspan></text>
  </g>

  <!-- Security Verification Seal -->
  <rect x="25" y="305" width="450" height="70" rx="12" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.3)"/>
  <circle cx="55" cy="340" r="18" fill="rgba(16,185,129,0.2)"/>
  <path d="M48 340 L53 345 L62 334" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="85" y="333" fill="#10b981" font-family="Inter, sans-serif" font-size="13" font-weight="800">Verified Admission Record &#8226; Vivan Gupta Strategy</text>
  <text x="85" y="352" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11">Protected under client confidentiality &#8226; Document Verified</text>
</svg>
